<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقشه راه ســـیــمـا</title>
  <meta http-equiv="refresh" content="0; url=research-report/roadmap.html">
  <link rel="icon" type="image/png" href="assets/sima-favicon-64.png" sizes="64x64">
  <link rel="icon" type="image/png" href="assets/sima-favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/sima-favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/sima-favicon-64.png">
  <link rel="stylesheet" href="assets/vazirmatn.css">
  <link rel="stylesheet" href="assets/sima-fonts.css">
  <style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
--primary: #4f46e5;
  --primary-dark: #4338ca;
  --primary-light: #eef2ff;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --radius: 1rem;
    --shadow: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding: 1rem;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin: 0 0 .5rem; color: var(--text); }
  .subtitle { color: var(--muted); font-size: 1rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15,23,42,.1); }
  .card-icon { font-size: 1.5rem; margin-bottom: .5rem; }
  .stat { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; line-height: 1.1; margin: .25rem 0; }
  .stat-label { color: var(--muted); font-size: .875rem; }
  .green { color: var(--success); }
  .amber { color: var(--warning); }
  .red { color: var(--danger); }
  .blue { color: var(--primary); }
  .sections {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
  }
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: var(--shadow);
  }
  .section-title {
    display: flex; align-items: center; gap: .5rem;
    font-size: 1.125rem; font-weight: 700;
    color: var(--text);
    margin: 0 0 1rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--border);
  }
  .section-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  ul { margin: 0; padding: 0 0 0 1.25rem; list-style: disc; }
  li { margin: .4rem 0; line-height: 1.6; font-size: .9rem; color: var(--text); }
  ol { margin: 0; padding: 0 0 0 1.25rem; list-style: decimal; }
  ol li { margin: .5rem 0; line-height: 1.6; font-size: .9rem; color: var(--text); }
  .badge { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .6rem; font-size: .7rem; font-weight: 700; border-radius: 9999px; text-transform: uppercase; letter-spacing: .02em; }
  .badge-done { background: var(--success-bg); color: var(--success); }
  .badge-progress { background: var(--warning-bg); color: var(--warning); }
  .badge-todo { background: var(--danger-bg); color: var(--danger); }
  .nav-bar { display: flex; gap: .5rem; margin-bottom: .5rem; justify-content: center; }
  .nav-btn { display: inline-block; padding: .5rem 1rem; background: var(--primary); color: white; text-decoration: none; border-radius: var(--radius); font-size: .875rem; font-weight: 600; transition: background .15s; min-width: 140px; }
  .nav-btn:hover { background: var(--primary-dark); }
  .footer { margin-top: 1rem; padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); text-align: center; font-size: .8rem; color: var(--muted); }
  .footer a { color: var(--primary); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  @media (max-width: 640px) {
    body { padding: 1rem; }
    .sections { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0; url=research-report/roadmap.html">
  </noscript>
  <div class="container" style="text-align: center; padding-top: 4rem;">
    <div class="sima-brand">
      <img src="assets/sima-logo.svg" alt="سیما" width="48" height="48" style="vertical-align: middle; margin-right: 0.5rem;">
      <span class="sima-logo-text">ســـیــمـا</span>
    </div>
    <h1 class="sima-title" style="margin: 1rem 0;">نقشه راه ســـیــمـا</h1>
    <p>اگر به صورت خودکار هدایت نشدید، <a href="research-report/roadmap.html">اینجا را کلیک کنید</a>.</p>
  </div>
  <script>window.location.href = "research-report/roadmap.html";</script>
</body>
</html>

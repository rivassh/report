<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد گزارش‌ها — ســـیــمـا</title>
  <link rel="icon" type="image/png" href="../assets/sima-favicon-64.png" sizes="64x64">
  <link rel="icon" type="image/png" href="../assets/sima-favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="../assets/sima-favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="../assets/sima-favicon-64.png">
  <link rel="stylesheet" href="../assets/vazirmatn.css">
  <link rel="stylesheet" href="../assets/sima-fonts.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --primary-light: #eef2ff;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --radius: 1rem;
      --shadow: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 1rem;
    }

    .container { max-width: 100%; margin: 0 auto; padding: 0 1rem; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 .5rem; color: var(--text); }
    .subtitle { color: var(--muted); font-size: .875rem; }

    .report-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 480px) {
      .report-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 768px) {
      .report-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    }

    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .report-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15,23,42,.15);
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: .75rem;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .report-id {
      font-family: monospace;
      font-size: .75rem;
      color: var(--primary);
      background: var(--primary-light);
      padding: .15rem .35rem;
      border-radius: .35rem;
    }

    .report-timestamp {
      font-size: .65rem;
      color: var(--muted);
    }

    .report-content {
      background: #f8fafc;
      border-radius: .4rem;
      padding: .75rem;
      overflow-x: auto;
      font-size: .65rem;
    }

    .report-json {
      font-family: monospace;
      font-size: .6rem;
      margin: 0;
      white-space: pre;
    }

    .no-reports {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      .report-json { font-size: .5rem; }
      .report-card { padding: .75rem; }
    }

    .nav-bar { display: flex; gap: .5rem; margin-bottom: .5rem; justify-content: center; }
    .nav-btn {
      display: inline-block;
      padding: .4rem .8rem;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: var(--radius);
      font-size: .75rem;
      font-weight: 600;
      transition: background .15s;
      min-width: 110px;
    }
    .nav-btn:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <a href="/" class="nav-btn">🏠 صفحه اصلی</a>
      <a href="reports/index.html" class="nav-btn">📊 داشبورد گزارش‌ها</a>
      <a href="research-report/" class="nav-btn">📈 گزارش تحقیقاتی</a>
    </nav>

    <header>
      <div class="sima-brand">
        <img src="../assets/sima-logo.svg" alt="سیما" width="32" height="32" style="vertical-align: middle; margin-right: 0.5rem;">
        <span class="sima-logo-text">ســـیــمـا</span>
      </div>
      <h1 style="margin-top: 0.5rem;">داشبورد گزارش‌ها و لاگ‌ها</h1>
      <p class="subtitle">گزارش‌ها و لاگ‌های دریافتی در realtime</p>
    </header>

    <div id="reports-container">
      <div class="no-reports">در حال بارگذاری گزارش‌ها...</div>
    </div>
  </div>

  <script>
    async function loadReports() {
      try {
        const response = await fetch('logs/all-reports.md');
        if (!response.ok) throw new Error('Failed to fetch reports');

        const markdown = await response.text();
        const container = document.getElementById('reports-container');

        if (!markdown.trim() || markdown.includes('در حال بارگذاری')) {
          container.innerHTML = '<div class="no-reports">هنوز هیچ گزارشی دریافت نشده است.</div>';
          return;
        }

        const sections = markdown.split(/^## /m);
        const reports = [];

        for (let i = 1; i < sections.length; i++) {
          const section = sections[i];
          const lines = section.split('\n');
          const timestampLine = lines[0];
          const codeBlock = lines.slice(1).join('\n');

          const timestamp = timestampLine;

          let jsonStr = '';
          if (codeBlock.includes('```json')) {
            const jsonPart = codeBlock.split('```json')[1].split('```')[0];
            jsonStr = jsonPart.trim();
          }

          try {
            const jsonData = JSON.parse(jsonStr);
            reports.push({
              timestamp,
              data: jsonData
            });
          } catch (e) {
            console.error('Failed to parse report JSON:', e);
          }
        }

        if (reports.length === 0) {
          container.innerHTML = '<div class="no-reports">فرمت گزارش‌ها نامعتبر است.</div>';
          return;
        }

        container.innerHTML = `
          <div class="report-grid">
            ${reports.map(report => `
              <div class="report-card">
                <div class="report-header">
                  <div class="report-id">${report.data.id || 'نامشخص'}</div>
                  <div class="report-timestamp">${report.timestamp}</div>
                </div>
                <div class="report-content">
                  <pre class="report-json">${JSON.stringify(report.data, null, 2)}</pre>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } catch (error) {
        console.error('Error loading reports:', error);
        document.getElementById('reports-container').innerHTML =
          '<div class="no-reports">خطا در بارگذاری گزارش‌ها. لطفاً بعداً دوباره تلاش کنید.</div>';
      }
    }

    loadReports();
    setInterval(loadReports, 30000);
  </script>
</body>
</html>
